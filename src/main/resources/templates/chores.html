<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general :: baseheader(~{:: title})}">
  <title th:text="${paginaTitel}">Huishoudtaken Overzicht</title>
</head>
<body>
<div class="container mt-4 mb-5">
<nav th:replace="~{fragments/general :: navbar}"></nav>
  <h1 class="main-title" th:text="${paginaTitel}"></h1>
  <form method="get" th:action="@{/chores}">
    <label for="familymember"></label>
    <select id="familymember" name="familymember">
      <option value="">-- Filter op familielid --</option>
      <option th:each="familymember : ${allFamilyMembers}"
              th:value="${familymember.memberId}"
              th:text="${familymember.fullName}"
              th:selected="${familymember.memberId == familymemberSelected}">
      </option>
    </select>
    <button type="submit">Filteren</button>
  </form>
  <div th:if="${successMessage}"
       class="alert alert-success">
    <span th:text="${successMessage}">Opgeslagen!</span>
  </div>
  <div class="row">
    <div class="col-md-4 mb-4" th:each="chore : ${chores}">
      <div class="card h-100 shadow-sm">

        <div class="card-body">

          <!-- Title -->
          <h5 class="card-title">
            <a th:href="@{chores/detail/{choreName}(choreName=${chore.choreName})}"
               th:text="${chore.choreName}">
              Taak naam
            </a>
          </h5>

          <!-- Cover Image -->
          <img th:if="${chore.coverImage != null}"
               th:src="@{/images/{id}(id=${chore.coverImage.id})}"
               class="card-img-top"
               th:alt="${chore.choreName}"
               style="height: 200px; object-fit: cover;">

          <!-- Frequency -->
          <p class="card-text">
            <strong>Frequentie:</strong>
            <span th:text="${chore.choreFrequency}"></span>
          </p>

          <!-- Location -->
          <p class="card-text">
            <strong>Locatie:</strong>
            <span th:text="${chore.location}"></span>
          </p>

          <!-- Family members -->
          <p class="card-text">
            <strong>Verantwoordelijke:</strong><br>
            <span th:each="familymember, iterStat : ${chore.familymembers}">
            <span th:text="${familymember.fullName}"></span>
            <span th:if="!${iterStat.last}">, </span>
          </span>
          </p>

        </div>

        <!-- Actions -->
        <div class="card-footer d-flex justify-content-between">
          <a sec:authorize="hasRole('ADMIN')" th:href="@{/chores/edit/{id}(id=${chore.id})}"
             class="btn btn-sm btn-outline-primary">
            <i class="bi bi-pencil-square"></i>
          </a>

          <a sec:authorize="hasRole('ADMIN')" th:href="@{/chores/delete/{id}(id=${chore.id})}"
             class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i>
          </a>
        </div>

      </div>
    </div>
  </div>
<!--  <p><a sec:authorize="hasRole('ADMIN')" th:href="@{/chores/add}">Nieuwe taak toevoegen</a></p>-->

  <!-- Button trigger modal -->
  <button sec:authorize="hasRole('ADMIN')" type="button" data-bs-toggle="modal" data-bs-target="#newChoreForm">
    Nieuwe taak toevoegen
  </button>

  <!-- Modal -->
  <div sec:authorize="hasRole('ADMIN')" class="modal fade" id="newChoreForm" tabindex="-1" aria-labelledby="newChoreFormLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="newChoreFormLabel">Nieuwe Huishoudtaak Toevoegen</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div th:replace="~{fragments/chore :: newChoreForm(newChore)}"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/general :: footer}"></footer>
<div th:replace="~{fragments/general :: scripts}"></div>
</body>
</html>
